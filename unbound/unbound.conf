server:
    verbosity: 1
    
    # Disable privilege dropping (fixes macOS 'user unbound does not exist')
    username: ""
    
    # Listen on specific IP (Router interface)
    interface: 192.168.4.1
    port: 53
    
    # Network performance & threading
    num-threads: 4
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4
    
    # Caching memory (RAM heavy for cache hits per DNS skill)
    msg-cache-size: 128m
    rrset-cache-size: 256m
    
    # TTL tuning (AI-driven/frontier concepts manual proxy: hold minimum TTL to prevent thrashing)
    cache-min-ttl: 300
    cache-max-ttl: 86400
    
    # Access Control (Allow local router subnets)
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.0.0/16 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow

    # Privacy & Security (RFC 7816 & DNSSEC)
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    hide-identity: yes
    hide-version: yes
    use-caps-for-id: yes
    edns-buffer-size: 1232
    
    # TLS Certificate Bundle (Required for DoT on macOS)
    tls-cert-bundle: "/etc/ssl/cert.pem"

    # Resilience (RFC 8767 Serve Stale & Prefetching)
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800

    # Local resolution / Ad-blocking (Optional DGA/Poisoning defense hook)
    # local-zone: "malicious.example.com" always_nxdomain

forward-zone:
    name: "."
    # Encrypted DNS (DoT - RFC 7858)
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 1.1.1.1@853#cloudflare-dns.com

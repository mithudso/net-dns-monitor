server:
    verbosity: 1
    
    # Drop root after binding port 53. The default user `unbound` does not
    # exist on macOS; an empty value kept the whole resolver running as root.
    username: "nobody"
    
    # Listen on specific IP (Router interface)
    interface: 192.168.4.1
    port: 53
    
    # Network performance & threading
    num-threads: 4
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4
    
    # Caching memory (RAM heavy for cache hits per DNS skill)
    msg-cache-size: 128m
    rrset-cache-size: 256m
    
    # TTL clamps. The 300s floor cuts upstream queries for short-TTL records, at
    # the cost of serving a changed record for up to five minutes.
    cache-min-ttl: 300
    cache-max-ttl: 86400
    
    # Access control: loopback and the router LAN only. Everything else keeps
    # unbound's default of refuse.
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.4.0/24 allow

    # Privacy & hardening (RFC 7816 QNAME minimisation). No trust anchor is
    # configured, so this resolver does not validate DNSSEC itself.
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    hide-identity: yes
    hide-version: yes
    use-caps-for-id: yes
    edns-buffer-size: 1232
    
    # TLS Certificate Bundle (Required for DoT on macOS)
    tls-cert-bundle: "/etc/ssl/cert.pem"

    # Resilience (RFC 8767 Serve Stale & Prefetching)
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800

    # Local resolution / Ad-blocking (Optional DGA/Poisoning defense hook)
    # local-zone: "malicious.example.com" always_nxdomain

forward-zone:
    name: "."
    # Encrypted DNS (DoT - RFC 7858)
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 1.1.1.1@853#cloudflare-dns.com

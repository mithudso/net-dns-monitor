# Copy to ~/.config/net-dns-monitor/config.yaml and edit.
# Any key you omit falls back to the default in netdnsmonitor/config.py.

external_targets:
  - ["1.1.1.1", 443]
  - ["8.8.8.8", 443]

internal_targets: []
  # - ["192.168.1.1", 443]   # e.g. your router

# Domains to resolve each check. Left empty by default -- the app does NOT
# auto-detect "most visited sites" from browser history (that would need
# reading another app's data, a separate opt-in, not a silent default).
# Add the handful of sites you actually care about:
domains: []
  # - "example.com"

# A name expected to always resolve, probed alongside the list above. It is the
# control that separates "this one name is dead" from "the resolver is broken",
# which is what makes auto-learned domains safe (see below). Set to null to
# drop it -- with no control and no configured domains, a dead learned name
# cannot be identified as dead.
#
# The Anthropic API host is the default because the app already needs to resolve
# it for LLM escalation: a failing control means escalation was going to fail
# anyway, so the probe result carries operational meaning.
control_domain: "api.anthropic.com"

# On top of the list above, any domain the unified log shows FAILING DNS
# resolution is added automatically -- evidence already on the machine that
# you tried to reach a name and could not. A learned domain that fails while
# other probed domains still resolve is a dead name rather than a broken
# resolver, so it is dropped again and can't hold the app in a permanent false
# incident. Domains you configured by hand are never dropped.
learn_domains_from_logs: true
learned_domains_path: "~/Library/Application Support/net-dns-monitor/learned_domains.json"
max_learned_domains: 20
# `log show` is slow, so don't scan every poll. Clamped to at least 2 x
# poll_interval_seconds: scanning every tick re-adds a dead name as fast as
# pruning drops it, which latches a permanent false incident.
domain_learn_interval_seconds: 300

poll_interval_seconds: 30
probe_timeout_seconds: 2.0   # shared deadline for ALL domain lookups in a tick
failure_threshold: 2   # consecutive failed checks before declaring an incident
success_threshold: 2   # consecutive healthy checks before clearing one

log_lookback: "5m"

# Strings to strip from any bundle sent to the Anthropic API on escalation
# (internal hostnames, VPN ranges, anything you don't want leaving the box).
sensitive_strings: []
  # - "corp.local"

reports_dir: "~/Library/Application Support/net-dns-monitor/reports"

# Notifications, sent once per incident onset after the report is written.
# Only a redacted summary plus the local report path leaves the machine --
# never the raw probe results or log excerpts.
#
# No credential lives in this file. Slack needs SLACK_WEBHOOK_URL in the
# environment; SMTP auth needs SMTP_PASSWORD. Without those, the channel is
# simply inactive.
slack_enabled: true

email_enabled: true
email_recipients: []
  # - "it-helpdesk@example.com"
email_from: "net-dns-monitor@localhost"
smtp_host: "localhost"
smtp_port: 587
smtp_username: null
smtp_starttls: true

notify_timeout_seconds: 5   # short on purpose: this runs while the net is down

# --- Automatic network failover ---------------------------------------------
# Moves the machine onto a backup network when the preferred one dies, by
# rewriting the macOS network service order, and moves it back when the
# preferred one recovers.
#
# OFF by default. This is the only feature that changes system network
# configuration, and it cannot guess which service you actually prefer -- a
# machine with three USB Ethernet adapters has three plausible answers.
#
# It only helps with one specific failure: the preferred link is UP (it has a
# link and an address, so macOS keeps routing over it) but carries no traffic.
# When a cable is simply unplugged, macOS already falls back on its own and
# this feature has nothing to do.
#
# Both names must match `networksetup -listnetworkserviceorder` EXACTLY. A name
# that doesn't match is reported as a failure listing the names that do exist;
# it is never fuzzy-matched onto a neighbouring adapter.
#
#   $ networksetup -listnetworkserviceorder
#   (1) AX88179B
#   (Hardware Port: AX88179B, Device: en6)
#   ...
#   (4) Wi-Fi
#   (Hardware Port: Wi-Fi, Device: en0)
#
# Changing the service order needs an administrator right. Whether that
# succeeds without a password prompt depends on your account and on the
# "Require an administrator password to access system-wide preferences"
# setting. If it is refused, the ladder step reports NEEDS_PRIVILEGE and
# nothing changes -- it never reports a switch that did not happen.
# Setting BOTH service names is what turns the feature on at all. `failover_
# enabled` then controls only whether it acts *by itself*:
#
#   names set, failover_enabled: false  -> manual only. The menu bar's
#       "Switch to backup now" button works; nothing ever moves on its own.
#       This is the way to try it before trusting it unattended.
#   names set, failover_enabled: true   -> automatic, per the settings below,
#       with the manual button still available.
#   either name unset                   -> feature off entirely.
failover_enabled: false
failover_preferred_service: null   # e.g. "USB 10/100/1G/2.5G LAN"

# One backup, or several. With several, every candidate that is independently
# confirmed reachable is benchmarked and the FASTEST wins outright -- the list
# order only breaks ties. Use `netdns interfaces` to see the exact names.
#
# These must be network SERVICE names, not Wi-Fi network names. "Wi-Fi" is the
# service; the SSID it joins is a different thing and will not be found here.
failover_backup_service: null      # e.g. "M3100"
failover_backup_services: []
  # - "M3100"        # USB dongle to the hotspot
  # - "iPhone USB"   # phone tethered over USB
  # - "Wi-Fi"        # last resort

# A disabled service (shown as (*) by `networksetup -listnetworkserviceorder`)
# is skipped by macOS no matter where it sits in the order, so failing over to
# one requires enabling it as well as promoting it. The app does both, and
# reports NEEDS_PRIVILEGE if either is refused.

# Throughput measurement, used to rank several backups. Set the host to "" to
# turn it off, in which case ranking falls back to reachability and list order
# rather than inventing numbers. The default endpoint serves an exact byte
# count over plain HTTPS with no account and no redirect, which is what makes
# it usable from a socket pinned to one interface.
failover_speedtest_host: "speed.cloudflare.com"
failover_speedtest_path: "/__down?bytes=2000000"
failover_speedtest_port: 443
failover_speedtest_timeout_seconds: 5.0
failover_speedtest_max_bytes: 2000000

# Which incidents may move the link. Network-only by default: a DNS fault is
# usually local (resolver cache, /etc/resolver override) and changing the
# physical path will not fix it. Add "dns" only if your wired link's resolver
# is the thing that dies.
#
# An explicitly empty list ([]) means nothing triggers a switch, which is the
# way to stage the feature — service names validated, nothing moving — before
# arming it. Removing the key entirely is NOT the same thing; that takes the
# "network" default.
failover_trigger_classifications:
  - network

# Deliberately asymmetric. Failing over happens on the first qualifying
# incident (already debounced by failure_threshold), but failing back waits for
# the preferred link to prove itself over this many consecutive checks -- so a
# link that flaps every 30s cannot drag the machine back and forth.
failover_failback_threshold: 3

# Minimum seconds between switches, in either direction.
failover_cooldown_seconds: 300

# Hard ceiling on churn. Once spent, the machine comes to rest on whichever
# side is currently carrying traffic. Set to 0 to disable switching entirely
# while leaving the rest of the feature configured.
failover_max_switches_per_hour: 4

# Records the exact service order in place before the first failover, so a
# failback restores it verbatim rather than leaving the backup permanently
# second. Also survives a restart, so an app relaunched mid-outage can still
# put you back.
failover_state_path: "~/Library/Application Support/net-dns-monitor/failover.json"

# Copy to ~/.config/net-dns-monitor/config.yaml and edit.
# Any key you omit falls back to the default in netdnsmonitor/config.py.

external_targets:
  - ["1.1.1.1", 443]
  - ["8.8.8.8", 443]

internal_targets: []
  # - ["192.168.1.1", 443]   # e.g. your router

# Domains to resolve each check. Left empty by default -- the app does NOT
# auto-detect "most visited sites" from browser history (that would need
# reading another app's data, a separate opt-in, not a silent default).
# Add the handful of sites you actually care about:
domains: []
  # - "example.com"

poll_interval_seconds: 30
failure_threshold: 2   # consecutive failed checks before declaring an incident
success_threshold: 2   # consecutive healthy checks before clearing one

log_lookback: "5m"

# Strings to strip from any bundle sent to the Anthropic API on escalation
# (internal hostnames, VPN ranges, anything you don't want leaving the box).
sensitive_strings: []
  # - "corp.local"

reports_dir: "~/Library/Application Support/net-dns-monitor/reports"

# Separately from the `domains` incident-detection list above: every
# resolution_interval_seconds, the app re-resolves every domain that has ever
# stalled -- read back out of resolution_log_path itself -- in parallel, and
# appends the outcome to that same log as JSONL.
resolution_log_path: "~/Library/Application Support/net-dns-monitor/resolution-log.jsonl"
resolution_interval_seconds: 300

# A lookup counts as "stalled" at or above this many seconds. This keys on how
# long the lookup took, not on whether it failed: an instant NXDOMAIN is a
# fast definitive answer, not a stall. Raise this if the retry list is larger
# than you want (1.0 -> 5.0 keeps only the badly hung lookups).
resolution_stall_seconds: 1.0

# Wall-clock ceiling on one batch; anything still outstanding is logged as
# "abandoned" and the batch returns. Keep it below
# resolution_interval_seconds. This is the real cap on a cycle -- see the note
# on resolution_timeout_seconds below.
resolution_batch_deadline_seconds: 240

# NOT enforceable per lookup: socket.setdefaulttimeout() does not bound
# socket.getaddrinfo(), which is a blocking call into the system resolver.
# Measured on macOS, a missing .local name took 5.01s against this 2.0 value.
# resolution_batch_deadline_seconds is what actually bounds a cycle.
resolution_timeout_seconds: 2.0
resolution_max_workers: 10

# Retired keys (ignored if present): resolution_lookback, resolution_top_n --
# the monitor no longer mines the query log for the busiest domains.

# --- Ping heartbeat -------------------------------------------------------
# One ICMP echo request to this host every ping_interval_seconds. Drives the
# network statistics in the menu bar, the Dock tile, and the network-failed
# alert (Dock bounce + notification). It never runs the repair ladder,
# escalates, or writes a report -- that stays with the debounced 30-second
# incident poll above.
#
# ICMP here even though prober.py deliberately avoids it: a filtered ICMP path
# only degrades the display and can raise a spurious alert, it cannot trigger a
# repair. If your network filters ICMP to 8.8.8.8, point this somewhere that
# answers.
ping_host: "8.8.8.8"
ping_interval_seconds: 5

# Bounds each ping. A failed ping takes about this long to give up (measured
# 3.08s at 3.0), so keep it comfortably under ping_interval_seconds.
ping_timeout_seconds: 2.0

# Consecutive failed pings before the alert fires. 1 is the literal reading of
# "if it fails a ping, alert", and the default. On Wi-Fi a lone lost echo
# request will occasionally trip it; raise to 2 to ignore single dropped
# packets while still alerting within 10 seconds of a real outage.
ping_failure_threshold: 1

# 0 means one alert per outage: it fires on the failure edge, then stays quiet
# until pings succeed again. Set to e.g. 300 to be re-alerted every 5 minutes
# while the network stays down. The Dock bounce is a critical-priority request
# that keeps bouncing until you activate the app, so a long outage stays
# visible without any repeat.
ping_alert_repeat_seconds: 0

# How many recent pings the loss percentage in the menu bar averages over.
# 12 at a 5-second cadence is the last minute.
ping_loss_window: 12

# --- Dashboard window -----------------------------------------------------
# The menu bar item's "Open dashboard" opens a window with the live statistics,
# the settings in force, discovered peers, and a button per troubleshooting
# step. This is how often it repaints and picks up the result of a step you ran
# from it. Costs a queue poll and a string comparison while the window is shut.
ui_refresh_seconds: 1

# --- Forensic log ---------------------------------------------------------
# Every network down/up episode is recorded: what was detected, every step
# taken, why each step was taken, and what it returned.
#
# The journal is appended to as each event happens, so an app killed or a
# machine powered off mid-outage still leaves the evidence behind. The
# per-episode .md/.json documents are written when the network comes back.
#
# One episode spans both detectors: it opens on the first "down" from either the
# 5-second ping heartbeat or the 30-second anti-flap gate, and closes only when
# both agree the network is back.
forensic_log_path: "~/Library/Application Support/net-dns-monitor/forensic-log.jsonl"
forensic_episodes_dir: "~/Library/Application Support/net-dns-monitor/episodes"

# --- LAN peer discovery ---------------------------------------------------
# Announce this instance on the local network, find other copies of the monitor
# on other machines, and heartbeat each one.
#
# WHAT THIS DISCLOSES: any host on the same LAN can learn this machine's
# hostname and whether its network is currently healthy. That is the point of
# the feature, but it is a disclosure -- set this to false and no socket is
# opened and nothing is broadcast.
#
# Nothing received over this socket is ever used as a path, a command, or an
# argument. Datagrams are size-capped, JSON-only, protocol-tagged, and every
# string is truncated and stripped of control characters.
peer_discovery_enabled: true
peer_port: 45737

# Re-announce and heartbeat every known peer on this cadence.
peer_announce_seconds: 300

# Heard from within this window: "current". Two announce intervals by default,
# so a single dropped broadcast does not demote a healthy peer.
peer_current_seconds: 600

# Heard from within this window but not the one above: "recent". Anything older
# is "other", kept as history. Peers are filed by elapsed time alone, so a
# machine that is switched off needs nothing to notice it left.
peer_recent_seconds: 86400

# The file record of current / recent / other hosts. Read back at startup, which
# is what lets a fresh process probe the hosts it knew about last run instead of
# waiting for someone to announce.
peer_record_path: "~/Library/Application Support/net-dns-monitor/peers.json"

# Open the dashboard window shortly after launch, so there is a visible window
# without having to find a menu first. It is ordered front WITHOUT stealing
# focus: this starts from a launchd agent at login, and yanking focus every
# login would be its own annoyance. Set false to keep it closed until asked for.
open_dashboard_at_launch: true

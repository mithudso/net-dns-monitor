# The verify loop documented in requirements-dev.txt, run on every push and PR:
#
#   ruff check . && ruff format --check . && python -m pytest -q
#
# Split across two jobs because they have different platform requirements, and
# only one of them actually needs a Mac:
#
#   lint  ubuntu -- ruff is a self-contained binary and needs none of the app's
#                   dependencies, so this runs on the cheapest runner and gives
#                   the fastest signal on the failure that is most common.
#   test  macOS  -- required, not a preference. The suite imports AppKit: it
#                   builds real NSWindows (tests/test_dashboard.py,
#                   test_settings_window.py) and renders real NSImages
#                   (test_dock_icon.py) rather than mocking them, because the
#                   properties that matter -- retain policy, button wiring,
#                   frame arithmetic -- are exactly the ones that fail silently
#                   in a frozen bundle. pyobjc-framework-Cocoa does not install
#                   on Linux.
#
# Both jobs pin the same ruff and pytest versions the repo pins, via
# requirements-dev.txt, so a green local run and a green CI run mean the same
# thing. A floating `pip install ruff` would drift and start failing this gate on
# rules nobody chose to adopt. The test job also installs through
# constraints.txt, which pins every transitive dependency to the versions the
# app is built with; without it, httpx, pydantic and pyobjc-core resolve fresh
# on each run.
name: CI

on:
  push:
  pull_request:
  # So the gate can be exercised by hand on a branch before opening a PR.
  workflow_dispatch:

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 3.13 is the supported floor (CLAUDE.md), the interpreter the app is
          # frozen against, and the one constraints.txt was generated from.
          # scripts/start.sh and scripts/install.sh refuse anything older. ruff
          # takes its target version from ruff.toml, not from this setting.
          python-version: "3.13"

      # Just ruff, at the pinned version -- installing the full dev requirements
      # here would pull pyobjc and fail on Linux for no benefit.
      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check .

      # Separate step from `check` on purpose: "formatting differs" and "a lint
      # rule was violated" are different problems with different fixes, and a
      # combined step hides which one failed.
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: pytest (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c constraints.txt

      # tests/conftest.py redirects HOME to a per-test tmp dir, stubs the Dock
      # icon call, and stubs the calls the app makes without an injected runner:
      # the privilege probe (`sudo -n -k -l`, `ifconfig -l`, `route get default`)
      # and the `log show` readers. Other modules take an injected run_fn, so the
      # suite does not run those tools or touch /etc/sudoers.d. It does start
      # local processes on purpose: test_console.py runs /bin/sh children to test
      # timeouts and process-group kills, and test_peer_net.py sends UDP over
      # loopback.
      - name: pytest
        run: python -m pytest -q

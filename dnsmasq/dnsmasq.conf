# dnsmasq.conf - DHCP and DNS Forwarder
# Binds to the router interface
listen-address=192.168.4.1
bind-interfaces

# Disable DNS server (Unbound handles this directly on port 53)
port=0

# DHCP Server Configuration
dhcp-range=192.168.4.50,192.168.4.150,12h
dhcp-option=option:router,192.168.4.1
dhcp-option=option:dns-server,192.168.4.1

# Optional: Log DHCP for monitoring
log-dhcp

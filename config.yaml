# The default configuration for Net-DNS-Monitor. Every key the app reads is
# declared here at its shipped value, and tests/test_config.py fails if any of
# them drifts from DEFAULT_CONFIG in netdnsmonitor/config.py -- so this file is
# the readable statement of what the app does by default, not a sample of one.
#
# The app reads the copy at ~/.config/net-dns-monitor/config.yaml. install.sh
# puts this file there on first install; edit it there, or use the settings
# window, then `net-dns-monitor-service restart`. Any key deleted from that copy
# falls back to the value below.

external_targets:
  - ["1.1.1.1", 443]
  - ["8.8.8.8", 443]

internal_targets: []
  # - ["192.168.1.1", 443]   # e.g. your router

# Domains to resolve each check. Left empty by default -- the app does NOT
# auto-detect "most visited sites" from browser history (that would need
# reading another app's data, a separate opt-in, not a silent default).
# Add the handful of sites you actually care about:
domains: []
  # - "example.com"

poll_interval_seconds: 30
failure_threshold: 2   # consecutive failed checks before declaring an incident
success_threshold: 2   # consecutive healthy checks before clearing one

log_lookback: "5m"

# Strings to strip from any bundle sent to the Anthropic API on escalation
# (internal hostnames, VPN ranges, anything you don't want leaving the box).
sensitive_strings: []
  # - "corp.local"

reports_dir: "~/Library/Application Support/net-dns-monitor/reports"

# Separately from the `domains` incident-detection list above: every
# resolution_interval_seconds, the app re-resolves every domain that has ever
# stalled -- read back out of resolution_log_path itself -- in parallel, and
# appends the outcome to that same log as JSONL.
resolution_log_path: "~/Library/Application Support/net-dns-monitor/resolution-log.jsonl"
resolution_interval_seconds: 300

# A lookup counts as "stalled" at or above this many seconds. This keys on how
# long the lookup took, not on whether it failed: an instant NXDOMAIN is a
# fast definitive answer, not a stall. Raise this if the retry list is larger
# than you want (1.0 -> 5.0 keeps only the badly hung lookups).
resolution_stall_seconds: 1.0

# Wall-clock ceiling on one batch; anything still outstanding is logged as
# "abandoned" and the batch returns. Keep it below
# resolution_interval_seconds. This is the real cap on a cycle -- see the note
# on resolution_timeout_seconds below.
resolution_batch_deadline_seconds: 240

# NOT enforceable per lookup: socket.setdefaulttimeout() does not bound
# socket.getaddrinfo(), which is a blocking call into the system resolver.
# Measured on macOS, a missing .local name took 5.01s against this 2.0 value.
# resolution_batch_deadline_seconds is what actually bounds a cycle.
resolution_timeout_seconds: 2.0
resolution_max_workers: 10

# Retired keys (ignored if present): resolution_lookback, resolution_top_n --
# the monitor no longer mines the query log for the busiest domains.

# --- Ping heartbeat -------------------------------------------------------
# One ICMP echo request to this host every ping_interval_seconds. Drives the
# network statistics in the menu bar, the Dock tile, and the network-failed
# alert (Dock bounce + notification). It never runs the repair ladder,
# escalates, or writes a report -- that stays with the debounced 30-second
# incident poll above.
#
# ICMP here even though prober.py deliberately avoids it: a filtered ICMP path
# only degrades the display and can raise a spurious alert, it cannot trigger a
# repair. If your network filters ICMP to 8.8.8.8, point this somewhere that
# answers.
ping_host: "8.8.8.8"
ping_interval_seconds: 5

# Bounds each ping. A failed ping takes about this long to give up (measured
# 3.08s at 3.0), so keep it comfortably under ping_interval_seconds.
ping_timeout_seconds: 2.0

# Consecutive failed pings before the alert fires.
#
# 1 is the literal reading of "if it fails a ping, alert". The default is 2, on
# measured evidence: at 1, lone dropped Wi-Fi packets each opened a forensic
# episode and bounced the Dock -- three episodes in ~22 minutes, only one of them
# a real outage. At 2 a single lost packet is ignored and a real outage still
# alerts within 10 seconds. Set it to 1 to see every dropped packet.
ping_failure_threshold: 2

# 0 means one alert per outage: it fires on the failure edge, then stays quiet
# until pings succeed again. Set to e.g. 300 to be re-alerted every 5 minutes
# while the network stays down. The Dock bounce is a critical-priority request
# that keeps bouncing until you activate the app, so a long outage stays
# visible without any repeat.
ping_alert_repeat_seconds: 0

# How many recent pings the loss percentage in the menu bar averages over.
# 12 at a 5-second cadence is the last minute.
ping_loss_window: 12

# --- Dashboard window -----------------------------------------------------
# The menu bar item's "Open dashboard" opens a window with the live statistics,
# the settings in force, discovered peers, and a button per troubleshooting
# step. This is how often it repaints and picks up the result of a step you ran
# from it. Costs a queue poll and a string comparison while the window is shut.
ui_refresh_seconds: 1

# --- Forensic log ---------------------------------------------------------
# Every network down/up episode is recorded: what was detected, every step
# taken, why each step was taken, and what it returned.
#
# The journal is appended to as each event happens, so an app killed or a
# machine powered off mid-outage still leaves the evidence behind. The
# per-episode .md/.json documents are written when the network comes back.
#
# One episode spans both detectors: it opens on the first "down" from either the
# 5-second ping heartbeat or the 30-second anti-flap gate, and closes only when
# both agree the network is back.
forensic_log_path: "~/Library/Application Support/net-dns-monitor/forensic-log.jsonl"
forensic_episodes_dir: "~/Library/Application Support/net-dns-monitor/episodes"

# --- LAN peer discovery ---------------------------------------------------
# Announce this instance on the local network, find other copies of the monitor
# on other machines, and heartbeat each one.
#
# WHAT THIS DISCLOSES: any host on the same LAN can learn this machine's
# hostname and whether its network is currently healthy. That is the point of
# the feature, but it is a disclosure -- set this to false and no socket is
# opened and nothing is broadcast.
#
# Nothing received over this socket is ever used as a path, a command, or an
# argument. Datagrams are size-capped, JSON-only, protocol-tagged, and every
# string is truncated and stripped of control characters.
peer_discovery_enabled: true
peer_port: 45737

# Re-announce and heartbeat every known peer on this cadence.
peer_announce_seconds: 300

# Heard from within this window: "current". Two announce intervals by default,
# so a single dropped broadcast does not demote a healthy peer.
peer_current_seconds: 600

# Heard from within this window but not the one above: "recent". Anything older
# is "other", kept as history. Peers are filed by elapsed time alone, so a
# machine that is switched off needs nothing to notice it left.
peer_recent_seconds: 86400

# The file record of current / recent / other hosts. Read back at startup, which
# is what lets a fresh process probe the hosts it knew about last run instead of
# waiting for someone to announce.
peer_record_path: "~/Library/Application Support/net-dns-monitor/peers.json"

# Open the dashboard window shortly after launch, so there is a visible window
# without having to find a menu first. It is ordered front WITHOUT stealing
# focus: this starts from a launchd agent at login, and yanking focus every
# login would be its own annoyance. Set false to keep it closed until asked for.
open_dashboard_at_launch: true

# --- Graph history --------------------------------------------------------
# Rolling window of heartbeat samples behind the three graphs in the window.
# 720 at the default 5s cadence is the last hour. One appended line per sample;
# the file is compacted when it outgrows the window.
history_path: "~/Library/Application Support/net-dns-monitor/history.jsonl"
history_max_samples: 720

# --- System log viewer ----------------------------------------------------
# The right-hand column of the window shows what macOS itself is saying about
# the network: the error and fault entries from mDNSResponder, configd, the
# Wi-Fi stack, and anything logging through com.apple.network. It fills itself
# in and refreshes on a cadence -- nothing has to be clicked -- and new error
# lines are also announced in the results pane on the left, so a problem is
# visible without watching the log.
#
# The search box above the pane ANDs its terms and treats a leading `-` as an
# exclusion: `dns -crowdstrike` shows DNS lines that are not from CrowdStrike.
# It is substring matching, not a regex, so a connection id like [C134.1.1:3]
# can be pasted straight in.
#
# Every number below was measured on a real machine with `log show`; the notes
# in netdnsmonitor/system_log.py record the measurements.
log_view_enabled: true

# Read once at launch, so the pane has history in it immediately instead of
# starting blank for a poll interval. 15 minutes measured 4.2s. A 60-minute
# window measured 16.9s, which is why this is bounded.
log_view_backfill_window: "15m"

# The steady-state poll. Deliberately a longer window than the interval below,
# so nothing falls into the gap between two polls; the overlap is de-duplicated
# in memory. 1 minute measured 1.4s.
log_view_poll_window: "1m"
log_view_poll_seconds: 30

# Not the 10 seconds used for the incident-report log excerpt: `log show` is
# scanning an archive and the machine is not always idle. Hitting this shows a
# "took longer than" line in the pane rather than an empty pane, because an
# empty pane reads as a quiet network.
log_view_timeout_seconds: 45

# Entries held in memory. Nothing is written to disk by the viewer.
log_view_max_entries: 3000

# Show only error and fault entries. All levels over the same subsystems
# measured 192,901 lines in 30 minutes; filtered to errors, the same window was
# 919. The "Errors only" button switches this while the app runs -- this key is
# just what it starts as.
log_view_errors_only: true

# Rows drawn into the pane. Identical messages are collapsed into a single row
# with an (xN) count before this limit applies.
log_view_row_limit: 400

# How many new error lines per poll are announced in the results pane on the
# left. A cap on the announcements only -- everything still appears in the log
# pane. Without it, one repeating message would push every manual result out.
log_view_announce_limit: 3

# Entries containing any of these substrings are dropped entirely. All four are
# high-frequency framework complaints from unrelated software, and they were
# burying the one line that mattered (a socket reporting "Network is
# unreachable"). Set to [] to see everything.
#
# The settings window separates these with commas, so a pattern that contains a
# comma has to be edited here instead.
log_view_noise_patterns:
  - "nw_endpoint_get_address called with null endpoint"
  - "nw_protocol_instance_set_output_handler"
  - "quic_crypto_queue_append not enqueing more packets"
  - "Too many groups requested"

# --- Peer-assisted fault localization -------------------------------------
# When an outage starts, peers are probed immediately rather than at the next
# announce sweep, and the verdict is computed this many seconds later -- long
# enough for replies to cross a LAN, short enough that the answer is still about
# the outage in progress.
#
# With at least one peer running, the app can tell apart: this machine, the local
# network, DNS on this machine, DNS for the whole network, and an upstream
# outage. With no peer it says so instead of guessing.
peer_probe_wait_seconds: 3

# How often the Dock tile may be repainted when only the round-trip number has
# changed. A status change (healthy/flaky/incident) always repaints immediately.
#
# This exists because setApplicationIconImage_ is synchronous and measured at
# ~2 seconds per call on the main thread: at the 5-second heartbeat, repainting
# every tick blocked the run loop for most of every cycle.
dock_refresh_seconds: 30

# --- Probe timeout ---------------------------------------------------------
# One shared deadline for every domain lookup in a tick, resolved on worker
# threads. Serial lookups would make the block additive: with 20 learned names
# plus the control domain, a resolver outage would freeze the menu bar for ~42s.
probe_timeout_seconds: 2.0

# --- Auto-learned domains --------------------------------------------------
# `domains` above is a floor, not the whole list. The app scans the unified log
# for failed DNS resolutions and probes those names too. On a stock macOS
# install this finds nothing -- hostnames are masked in the log by default. See
# the README's "Auto-learned domains" section before turning it up.
learn_domains_from_logs: true
learned_domains_path: "~/Library/Application Support/net-dns-monitor/learned_domains.json"
max_learned_domains: 20
# Clamped to at least twice poll_interval_seconds by load_config. Scanning every
# tick re-adds a dead name as fast as pruning drops it, so the flap gate's
# success counter never resets and one dead name latches a permanent incident.
domain_learn_interval_seconds: 300
# A name expected to always resolve, probed alongside the rest. It is the
# control that lets a dead learned name be told apart from a broken resolver:
# control up + learned name down means the name is dead; control down means DNS
# really is broken and nothing is pruned. Set to null to drop it -- with no
# control and an empty `domains`, pruning loses its anchor.
control_domain: "api.anthropic.com"

# --- Notifications ---------------------------------------------------------
# Secrets are NOT here and must not be added: the Slack webhook URL comes from
# SLACK_WEBHOOK_URL and the SMTP password from SMTP_PASSWORD, so a config file
# that gets shared or synced carries no credential. For a Slack incoming webhook
# the URL *is* the credential.
#
# Both channels are opt-in by their credential being present: no webhook URL and
# no recipients means no channels and a notifier that is a cheap no-op.
slack_enabled: true
email_enabled: true
email_recipients: []
email_from: "net-dns-monitor@localhost"
smtp_host: "localhost"
smtp_port: 587
smtp_username: null
smtp_starttls: true
# Short on purpose: this runs on the run loop at the moment the network is known
# to be broken.
notify_timeout_seconds: 5

# --- Automatic failover to a backup network --------------------------------
# Off, and with no services named, until you fill in both. Switching the
# network service order is a privileged write, and doing it automatically on a
# machine whose network layout this app has never seen is not a safe default.
#
# `networksetup -listallnetworkservices` prints the names to use. They must
# match exactly, including case and spacing.
failover_enabled: false
failover_preferred_service: null
failover_backup_service: null
# Additional backups, ranked by measured throughput when more than one is up.
failover_backup_services: []

# Which classifications may trigger a switch. Network-only by default: a DNS
# fault is usually local (resolver cache, /etc/resolver override) and moving the
# physical path does not address it.
failover_trigger_classifications:
  - network

# Consecutive healthy ticks on the preferred link before failing back to it.
# Failing back on the first good tick would flap across a link that is coming up
# and going down again.
failover_failback_threshold: 3
# Minimum seconds between switches, and a hard ceiling per hour. Both exist so
# that a link flapping at the physical layer cannot turn into a rewrite loop of
# the system's network service order.
failover_cooldown_seconds: 300
failover_max_switches_per_hour: 4
# Where the pre-failover service order and the switch history are kept, so a
# restart mid-failover can still put the original order back.
failover_state_path: "~/Library/Application Support/net-dns-monitor/failover.json"

# Throughput probe used to rank several backups. A plain HTTPS download of a
# bounded number of bytes -- no speedtest SDK, no third-party account.
failover_speedtest_host: "speed.cloudflare.com"
failover_speedtest_path: "/__down?bytes=2000000"
failover_speedtest_port: 443
failover_speedtest_timeout_seconds: 5.0
failover_speedtest_max_bytes: 2000000

# What the interface prober aims at, when that has to differ from
# `external_targets` above. Empty means "use external_targets", which is right
# for most machines.
#
# The two questions are not the same. The ordinary probe asks "is the internet
# reachable" and wants a target out on it. The interface probe asks "would this
# specific adapter carry traffic" and pins the socket with IP_BOUND_IF -- which
# bypasses any VPN tunnel. On a machine routing through one, every physical
# interface reads unreachable against an internet target while the machine is
# plainly online, and automatic failover goes inert.
#
# Aim this at something reachable off-tunnel, usually the LAN gateway of each
# link, e.g.:
#   failover_probe_targets:
#     - ["192.168.68.1", 53]
#     - ["192.168.1.1", 53]
#
# Do NOT solve this by repointing `external_targets` at a gateway: the ordinary
# probe would then call the network healthy straight through an ISP outage,
# because the gateway answers either way.
failover_probe_targets: []

# The interface prober spends ONE deadline across all `failover_probe_targets`,
# so the budget is a function of how many are listed. Per-link gateways are
# unreachable from every link but their own, and an unreachable gateway
# blackholes for the full deadline rather than refusing -- measured here at a
# flat 2.00s. With a 2s budget the first target eats all of it and the reachable
# one is never tried, so the probe reports "unreachable" about a working link.
#
# Allow roughly (number of targets x 2s) + headroom. 0 means "use
# probe_timeout_seconds". Only ever spent once the machine has failed over or is
# in an incident: a healthy tick that never failed over runs no probes at all.
failover_probe_timeout_seconds: 0

# --- Router ----------------------------------------------------------------
# Off by default. When on, this machine shares its WAN link out over the LAN
# interface and runs a DHCP server on it. Interface names are BSD device names
# as `ifconfig` lists them; the router window in the menu bar offers a picker.
# The Router is built once at launch, so changing any of these here needs
# `net-dns-monitor-service restart`.
router_enabled: false
wan_interface: "en3"
lan_interface: "en0"
lan_ip: "192.168.10.1"
lan_netmask: "255.255.255.0"
dhcp_start: "192.168.10.100"
dhcp_end: "192.168.10.200"

# --- Console ---------------------------------------------------------------
# Open the console window on launch, docked below the log viewer on the right
# of the screen. Set false to open it only from the menu or dashboard.
auto_open_console: true
